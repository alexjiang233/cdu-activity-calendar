<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180"><rect width="720" height="180" rx="12" fill="#f0e7e1"/><g font-family="Microsoft YaHei,sans-serif" text-anchor="middle"><g transform="translate(20 20)"><rect width="200" height="140" rx="8" fill="#fffdf9"/><text x="100" y="28" fill="#ad2638" font-size="14">① 看卡片和原文</text><path d="M25 55h60M25 70h50M25 85h55M115 55h60M115 70h50M115 85h55" stroke="#bda99d" stroke-width="4"/><text x="100" y="119" fill="#806e70" font-size="12">对照依据，不靠猜</text></g><text x="240" y="100" font-size="24" fill="#ad2638">→</text><g transform="translate(260 20)"><rect width="200" height="140" rx="8" fill="#fffdf9"/><text x="100" y="28" fill="#ad2638" font-size="14">② 做一个决定</text><rect x="25" y="48" width="150" height="35" rx="5" fill="#ad2638"/><text x="100" y="71" fill="#fff" font-size="13">设为精选</text><text x="100" y="119" fill="#806e70" font-size="12">也能普通收录或跳过</text></g><text x="480" y="100" font-size="24" fill="#ad2638">→</text><g transform="translate(500 20)"><rect width="200" height="140" rx="8" fill="#fffdf9"/><text x="100" y="28" fill="#ad2638" font-size="14">③ 预览后发布</text><rect x="25" y="48" width="150" height="35" rx="5" fill="#f0e7e1"/><text x="100" y="71" fill="#6d1c2c" font-size="13">打开网站预览 ↗</text><text x="100" y="119" fill="#806e70" font-size="12">满意后再更新网站</text></g></g></svg>
